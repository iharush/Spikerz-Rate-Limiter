# Resolve service addresses again after container recreation, so a backend
# restart does not require restarting the public entry point too.
resolver 127.0.0.11 valid=2s ipv6=off;
upstream issuer_backend { zone issuer_backend 64k; server issuer:3000 resolve; }
upstream data_backend { zone data_backend 64k; server data-api:3001 resolve; }
upstream control_backend { zone control_backend 64k; server control-api:3002 resolve; }
upstream management_backend { zone management_backend 64k; server management-api:3003 resolve; }
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  # Only public route prefixes are forwarded. Internal commands/events and
  # storage ports have no host exposure.
  location /auth/ { proxy_pass http://issuer_backend/; }
  location ^~ /data/demo { proxy_pass http://data_backend/demo; }
  location ^~ /control/admin/ { proxy_pass http://control_backend/admin/; }
  location ^~ /management/users { proxy_pass http://management_backend/users; }
  location ^~ /management/analytics/ { proxy_pass http://management_backend/analytics/; }
  location = /management/status { proxy_pass http://management_backend/status; }
  location /socket.io/ {
    proxy_pass http://management_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
  }
  location ~ ^/(data|control|management)/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
