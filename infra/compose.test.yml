name: spikerz-test
services:
  data-test-db:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: spikerz_test, POSTGRES_USER: test, POSTGRES_PASSWORD: test }
    ports: ['127.0.0.1:55431:5432']
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      {
        test: [CMD-SHELL, 'pg_isready -U test -d spikerz_test'],
        interval: 2s,
        timeout: 2s,
        retries: 30,
      }
  control-test-db:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: spikerz_test, POSTGRES_USER: test, POSTGRES_PASSWORD: test }
    ports: ['127.0.0.1:55432:5432']
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      {
        test: [CMD-SHELL, 'pg_isready -U test -d spikerz_test'],
        interval: 2s,
        timeout: 2s,
        retries: 30,
      }
  management-test-db:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: spikerz_test, POSTGRES_USER: test, POSTGRES_PASSWORD: test }
    ports: ['127.0.0.1:55433:5432']
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      {
        test: [CMD-SHELL, 'pg_isready -U test -d spikerz_test'],
        interval: 2s,
        timeout: 2s,
        retries: 30,
      }
